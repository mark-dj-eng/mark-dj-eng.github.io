});</script><script>document.addEventListener("DOMContentLoaded", function() {
  const slides = document.querySelectorAll('.testimonial-slide');
  const prevBtn = document.querySelector('.testimonial-prev');
  const nextBtn = document.querySelector('.testimonial-next');
  const container = document.querySelector('.testimonial-container');
  let current = 0;
  let autoRotate;
  const autoRotateDelay = 6000; // time between slides (ms)

  function showSlide(index) {
    slides.forEach(slide => slide.classList.remove('active'));
    slides[index].classList.add('active');
  }

  function nextSlide() {
    current = (current + 1) % slides.length;
    showSlide(current);
  }

  function prevSlide() {
    current = (current - 1 + slides.length) % slides.length;
    showSlide(current);
  }

  // Button controls
  prevBtn.addEventListener('click', () => {
    prevSlide();
    resetAutoRotate();
  });

  nextBtn.addEventListener('click', () => {
    nextSlide();
    resetAutoRotate();
  });

  // Auto rotation
  function startAutoRotate() {
    autoRotate = setInterval(nextSlide, autoRotateDelay);
  }

  function stopAutoRotate() {
    clearInterval(autoRotate);
  }

  function resetAutoRotate() {
    stopAutoRotate();
    startAutoRotate();
  }

  // Swipe support (mobile)
  let startX = 0;
  let endX = 0;

  if (container) {
    container.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
    });

    container.addEventListener('touchmove', e => {
      endX = e.touches[0].clientX;
    });

    container.addEventListener('touchend', () => {
      const diff = startX - endX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextSlide(); // swipe left
        else prevSlide();          // swipe right
        resetAutoRotate();
      }
    });

    // Pause on hover (desktop only)
    container.addEventListener('mouseenter', stopAutoRotate);
    container.addEventListener('mouseleave', startAutoRotate);
  }

  // Initialize
  showSlide(current);
  startAutoRotate();
});</script><script>document.addEventListener("DOMContentLoaded", function() {

  items.forEach(item => {

      const src = this.getAttribute("data-src");
      const art = this.getAttribute("data-art");
      const name = this.getAttribute("data-title");

      // Update player and artwork
      player.src = src;
      title.textContent = name;
      artwork.src = art;

      // Play automatically
      player.play();

      // Optional: visual active state
      items.forEach(i => i.classList.remove("active"));
      this.classList.add("active");
    });
  });
});</script><script>document.querySelectorAll('.flyers-tabs .tab-link').forEach(button => {
